[project]
name = "reframe-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.0",
  "httpx>=0.28,<1",
  "pydantic==2.13.5",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.35,<1",
  "yt-dlp==2026.8.19",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff==0.16.9"]

[project.optional-dependencies]
transcription = ["faster-whisper==1.2.1", "ctranslate2==4.8.2", "onnxruntime==1.30.0"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
